<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pro Crypto Chart — Full</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Lightweight Charts (standalone build) -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    :root{
      --bg-dark: #071322;
      --panel-dark: #0b1a26;
      --text-light: #cfe3f1;
      --muted: #93a7b5;
      --accent: #60a5fa;
      --green: #26a69a;
      --red: #ff4976;
      --glass: rgba(255,255,255,0.03);
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,var(--bg-dark),#031123);color:var(--text-light)}
    .app{max-width:1200px;margin:12px auto;padding:12px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .left{display:flex;gap:10px;align-items:center}
    .tabs{display:flex;gap:6px}
    .tab{padding:8px 12px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.03);cursor:pointer;color:var(--text-light)}
    .tab.active{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);box-shadow:0 6px 18px rgba(2,6,23,0.5)}
    .controls{display:flex;gap:8px;align-items:center}
    .btn{padding:8px 10px;border-radius:8px;border:none;background:linear-gradient(180deg,#113344,#0b2a3a);color:#e6eef8;cursor:pointer}
    .badge{color:var(--muted);font-size:13px;margin-left:6px}
    #container{background:var(--panel-dark);border-radius:10px;padding:12px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 10px 30px rgba(2,6,23,0.6)}
    #chart{height:520px}
    #depth{height:160px;margin-top:10px}
    .settings-panel{position:fixed;right:18px;top:80px;background:rgba(2,8,16,0.9);padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);width:260px;z-index:60}
    .settings-panel h4{margin:0 0 8px 0;font-size:14px;color:var(--text-light)}
    .settings-row{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
    .input, select{padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text-light)}
    .small{font-size:12px;color:var(--muted)}
    .flex-row{display:flex;gap:8px;align-items:center}
    .color-swatch{width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);cursor:pointer}
    .legend{display:flex;gap:8px;align-items:center;margin-top:6px}
    @media(max-width:880px){
      .topbar{flex-direction:column;align-items:stretch;gap:10px}
      #chart{height:420px}
      .settings-panel{position:static;width:100%;margin-top:10px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="left">
        <div class="tabs" id="tabs"></div>
        <div class="badge" id="pairBadge"></div>
      </div>

      <div class="controls">
        <select id="interval" class="tab">
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="1h">1h</option>
          <option value="1d">1d</option>
        </select>
        <button id="toggleCurrency" class="btn">USD</button>
        <button id="fullscreenBtn" class="btn">Full screen</button>
        <div class="badge">INR rate:<strong id="inrRate" style="margin-left:6px">—</strong></div>
      </div>
    </div>

    <div id="container">
      <div id="chart"></div>
      <div id="depth"></div>
    </div>

    <div style="margin-top:10px;color:var(--muted);font-size:13px">
      Tip: Click a tab to switch pairs. Use mouse wheel or pinch to zoom; drag to pan.
    </div>
  </div>

  <!-- Settings panel -->
  <div class="settings-panel" id="settingsPanel" aria-hidden="false">
    <h4>Settings</h4>

    <div class="settings-row">
      <label class="small">Theme</label>
      <div class="flex-row">
        <select id="themeSelect" class="input" style="width:100%">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
    </div>

    <div class="settings-row">
      <label class="small">Color Preset</label>
      <div class="flex-row">
        <div class="color-swatch" id="preset1" title="Preset 1" style="background:linear-gradient(135deg,#60a5fa,#7dd3fc)"></div>
        <div class="color-swatch" id="preset2" title="Preset 2" style="background:linear-gradient(135deg,#22c55e,#60a5fa)"></div>
      </div>
      <div class="small" style="margin-top:6px">Pick a color palette for candles & accents.</div>
    </div>

    <div class="settings-row">
      <label class="small">Chart Type</label>
      <select id="chartType" class="input">
        <option value="candles">Candles</option>
        <option value="line">Line</option>
      </select>
    </div>

    <div class="settings-row">
      <label class="small">Data Points (max)</label>
      <div class="flex-row">
        <input id="pointCap" class="input" type="number" min="50" max="2000" value="600" />
      </div>
      <div class="small">Lower values use less memory. Change and click 'Apply'</div>
    </div>

    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="applySettings" class="btn">Apply</button>
      <button id="closeSettings" class="btn">Close</button>
    </div>
  </div>

<script>
/* ---------------------------
  Full TradingView-style chart
  - Candles + Volume
  - Depth chart
  - Fullscreen, zoom+pan
  - USD/INR toggle
  - Tabs for pairs
  - Settings panel: theme/colors/point cap/chart type
  - Defensive sanitization & bounded history
-----------------------------*/

// ========== CONFIG ==========
const PAIRS = ['btcusdt','ethusdt','solusdt','bnbusdt','xrpusdt']; // available tabs
let currentPair = PAIRS[0];
let currentInterval = '1m';
let useINR = false;

// default MAX_POINTS (will be overridden by settings)
let MAX_POINTS = 600;

// cached history per pair (raw USD candles)
const cache = {}; // cache[pair] = { candles: [ {time, open, high, low, close, volume} ], lastUpdate }

// inr rate
let inrRate = 85;

// chart holders
let mainChart, candleSeries, lineSeries, volumeSeries;
let depthChart, bidsSeries, asksSeries;

// websocket
let ws = null;

// defaults for colors / theme
let theme = 'dark';
let accentPreset = 1;
let chartType = 'candles';

// helper formatters
const nf = n => Number(n).toLocaleString(undefined,{maximumFractionDigits:8});
const nf2 = n => Number(n).toLocaleString(undefined,{maximumFractionDigits:2});

// ------- UI Elements -------
const tabsEl = document.getElementById('tabs');
const pairBadge = document.getElementById('pairBadge');
const intervalEl = document.getElementById('interval');
const toggleCurrencyBtn = document.getElementById('toggleCurrency');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const inrRateEl = document.getElementById('inrRate');

const themeSelect = document.getElementById('themeSelect');
const preset1 = document.getElementById('preset1');
const preset2 = document.getElementById('preset2');
const chartTypeEl = document.getElementById('chartType');
const pointCapEl = document.getElementById('pointCap');
const applySettingsBtn = document.getElementById('applySettings');
const closeSettingsBtn = document.getElementById('closeSettings');

// build tabs
function buildTabs(){
  tabsEl.innerHTML = '';
  PAIRS.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (p===currentPair ? ' active' : '');
    btn.innerText = p.toUpperCase().replace('USDT','/USDT');
    btn.onclick = ()=> { switchPair(p); };
    tabsEl.appendChild(btn);
  });
  pairBadge.innerText = currentPair.toUpperCase();
}
buildTabs();

// ---------- Theme / Settings behavior ----------
function applyTheme(){
  const root = document.documentElement.style;
  if(theme==='dark'){
    root.setProperty('--bg-dark','#071322');
    root.setProperty('--panel-dark','#0b1a26');
    root.setProperty('--text-light','#cfe3f1');
  } else {
    root.setProperty('--bg-dark','#f6f8fa');
    root.setProperty('--panel-dark','#ffffff');
    root.setProperty('--text-light','#0b1220');
  }
  // accent presets -> change series color choices later when reinit series
}

preset1.onclick = ()=>{ accentPreset = 1; preset1.style.outline = '2px solid rgba(255,255,255,0.08)'; preset2.style.outline='none'; };
preset2.onclick = ()=>{ accentPreset = 2; preset2.style.outline = '2px solid rgba(255,255,255,0.08)'; preset1.style.outline='none'; };

applySettingsBtn.onclick = ()=>{
  theme = themeSelect.value;
  chartType = chartTypeEl.value;
  const cap = Number(pointCapEl.value) || 600;
  MAX_POINTS = Math.max(50, Math.min(2000, cap));
  applyTheme();
  rebuildSeries(); // re-create series with new color / chart type / cap
  redrawMainFromCache();
  alert('Settings applied: theme='+theme+', chart='+chartType+', points='+MAX_POINTS);
};
closeSettingsBtn.onclick = ()=>{ document.getElementById('settingsPanel').style.display='none'; };

// ---------- INR rate fetch ----------
async function refreshINR(){
  try{
    const r = await fetch('https://api.exchangerate.host/latest?base=USD&symbols=INR');
    const j = await r.json();
    if(j && j.rates && j.rates.INR) inrRate = j.rates.INR;
  }catch(e){
    console.warn('INR fetch failed', e);
  }
  inrRateEl.innerText = nf2(inrRate);
}
refreshINR();
setInterval(refreshINR, 60000);

// ---------- Chart initialization ----------
function initCharts(){
  // main
  mainChart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: theme==='dark' ? '#071322' : '#f6f8fa' }, textColor: theme==='dark' ? '#cfe3f1' : '#0b1220' },
    grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
    rightPriceScale: { borderColor: '#253240' },
    timeScale: { borderColor: '#253240', timeVisible: true },
    localization: { priceFormatter: price => (useINR ? nf2(price) : nf(price)) }
  });

  mainChart.applyOptions({
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true },
    handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
  });

  // add series placeholders
  // create function to add the proper series depending on chartType
  rebuildSeries();

  // depth chart
  depthChart = LightweightCharts.createChart(document.getElementById('depth'), {
    layout: { background: { color: '#061b27' }, textColor: '#9fb5c8' },
    height: 160,
    rightPriceScale: { visible: false },
    timeScale: { visible: false },
    grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(255,255,255,0.02)' } }
  });
  bidsSeries = depthChart.addAreaSeries({ topColor: 'rgba(38,166,154,0.2)', bottomColor: 'rgba(38,166,154,0.02)', lineColor: 'rgba(38,166,154,0.9)' });
  asksSeries = depthChart.addAreaSeries({ topColor: 'rgba(255,73,118,0.2)', bottomColor: 'rgba(255,73,118,0.02)', lineColor: 'rgba(255,73,118,0.9)' });

  // resize on fullscreen
  document.addEventListener('fullscreenchange', ()=>{ setTimeout(()=>{ mainChart.resize(document.getElementById('chart').clientWidth, document.getElementById('chart').clientHeight); depthChart.resize(); }, 200); });
}
initCharts();

// rebuild series (used when switching chart type or theme)
function rebuildSeries(){
  // destroy existing series by creating a fresh chart? LightweightCharts doesn't support removing series easily
  // We'll remove series by setting empty data and re-adding new series types
  try{ if(candleSeries) mainChart.removeSeries(candleSeries); }catch(e){}
  try{ if(lineSeries) mainChart.removeSeries(lineSeries); }catch(e){}
  try{ if(volumeSeries) mainChart.removeSeries(volumeSeries); }catch(e){}

  // color choices based on preset
  let upColor = '#26a69a', downColor = '#ff4976', accent = '#60a5fa';
  if(accentPreset===2){ upColor = '#22c55e'; downColor = '#ff4976'; accent = '#60a5fa'; }

  if(chartType==='candles'){
    candleSeries = mainChart.addCandlestickSeries({
      upColor, downColor, borderVisible:false, wickUpColor: upColor, wickDownColor: downColor
    });
  } else {
    lineSeries = mainChart.addLineSeries({ color: accent, lineWidth: 2 });
  }

  volumeSeries = mainChart.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: '',
    scaleMargins: { top: 0.8, bottom: 0 },
  });
}

// ========== Data fetching & caching ==========

// Fetch historical klines (Binance REST)
async function fetchHistorical(pair, interval){
  try{
    const url = `https://api.binance.com/api/v3/klines?symbol=${pair.toUpperCase()}&interval=${interval}&limit=1000`;
    const r = await fetch(url);
    const j = await r.json();
    if(!Array.isArray(j)) return [];
    const candles = j.map(k => ({
      time: Math.floor(k[0]/1000),
      open: Number(k[1]),
      high: Number(k[2]),
      low: Number(k[3]),
      close: Number(k[4]),
      volume: Number(k[5])
    }));
    cache[pair] = cache[pair] || { candles: [] };
    cache[pair].candles = candles.slice(-MAX_POINTS);
    cache[pair].lastUpdate = Date.now();
    return cache[pair].candles;
  }catch(e){
    console.warn('fetch historical failed', e);
    return [];
  }
}

// sanitize + cap + convert to INR or USD when drawing
function getCleanSeries(pair){
  const raw = cache[pair] && Array.isArray(cache[pair].candles) ? cache[pair].candles.slice(-MAX_POINTS) : [];
  const clean = raw.filter(c => Number.isFinite(c.close) && c.close>0).map(c=>{
    const factor = useINR ? inrRate : 1;
    return { time: c.time, open: c.open*factor, high: c.high*factor, low: c.low*factor, close: c.close*factor, volume: c.volume };
  });
  return clean;
}

function redrawMainFromCache(){
  const pair = currentPair;
  const data = getCleanSeries(pair);
  if(chartType==='candles' && candleSeries){
    candleSeries.setData(data);
  } else if(chartType==='line' && lineSeries){
    // convert to simple line dataset using close prices
    const lineData = data.map(d => ({ time:d.time, value: d.close }));
    lineSeries.setData(lineData);
  }
  // volume
  const vol = data.map(d => ({ time: d.time, value: d.volume, color: d.close >= d.open ? 'rgba(38,166,154,0.75)' : 'rgba(255,73,118,0.75)' })).slice(-MAX_POINTS);
  volumeSeries.setData(vol);
}

// update cache with new kline (raw USD)
function pushKlineToCache(pair, k){
  cache[pair] = cache[pair] || { candles: [] };
  const arr = cache[pair].candles;
  const cand = {
    time: Math.floor(k.t/1000),
    open: Number(k.o),
    high: Number(k.h),
    low: Number(k.l),
    close: Number(k.c),
    volume: Number(k.v)
  };
  if(!Number.isFinite(cand.close) || cand.close<=0) return;
  if(arr.length && arr[arr.length-1].time === cand.time){
    arr[arr.length-1] = cand;
  } else {
    arr.push(cand);
  }
  if(arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
  cache[pair].lastUpdate = Date.now();
  // redraw after update
  redrawMainFromCache();
}

// ---------- WebSocket (Binance Kline stream) ----------
function klineStreamUrl(pair, interval){
  return `wss://stream.binance.com:9443/ws/${pair.toLowerCase()}@kline_${interval}`;
}
function reconnectKline(){
  if(ws){
    try{ ws.close(); }catch(e){}
    ws = null;
  }
  const url = klineStreamUrl(currentPair, currentInterval);
  ws = new WebSocket(url);
  ws.onopen = ()=>console.log('kline ws open', url);
  ws.onmessage = evt => {
    try{
      const msg = JSON.parse(evt.data);
      if(!msg.k) return;
      pushKlineToCache(currentPair, msg.k);
    }catch(e){ console.warn('kline parse err', e); }
  };
  ws.onclose = ()=>{ console.warn('kline closed, reconnecting'); setTimeout(reconnectKline,2000); };
  ws.onerror = e => { console.warn('kline ws error', e); };
}

// ---------- Depth (order book snapshot and rendering) ----------
async function fetchAndRenderDepth(pair){
  try{
    const url = `https://api.binance.com/api/v3/depth?symbol=${pair.toUpperCase()}&limit=200`;
    const res = await fetch(url);
    const j = await res.json();
    if(!j || !j.bids || !j.asks) return;
    const bids = j.bids.map(b => ({ price: Number(b[0]), qty: Number(b[1]) })).sort((a,b)=>b.price-a.price);
    const asks = j.asks.map(a => ({ price: Number(a[0]), qty: Number(a[1]) })).sort((a,b)=>a.price-b.price);

    let cum = 0;
    const bidsCum = bids.map(b => { cum += b.qty; return { price:b.price, cum: cum }; });
    cum = 0;
    const asksCum = asks.map(a => { cum += a.qty; return { price:a.price, cum: cum }; });

    // set data for area series expecting { time: price, value: cum }
    bidsSeries.setData(bidsCum.slice().reverse().map(x => ({ time: x.price, value: x.cum })));
    asksSeries.setData(asksCum.map(x => ({ time: x.price, value: x.cum })));
  }catch(e){ console.warn('depth fetch failed', e); }
}

// ---------- WazirX / CoinDCX INR support (best-effort) ----------
async function fetchIndianPrices(pair){
  const key = pair.toLowerCase();
  const mapping = {
    'btcusdt':'btcinr','ethusdt':'ethinr','bnbusdt':'bnbinr','xrpusdt':'xrpinr','solusdt':'solinr'
  };
  const inrKey = mapping[key];
  let wzPrice = null, cdPrice = null;
  try{
    if(inrKey){
      const r = await fetch('https://api.wazirx.com/api/v2/tickers');
      const j = await r.json();
      if(j && j[inrKey]) wzPrice = Number(j[inrKey].last);
    }
  }catch(e){}
  try{
    const res = await fetch('https://public.coindcx.com/market_data/tickers');
    const arr = await res.json();
    if(Array.isArray(arr) && inrKey){
      const base = inrKey.replace('inr','').toUpperCase();
      const found = arr.find(it => it.market==='INR' && it.base_unit && it.base_unit.toUpperCase()===base);
      if(found) cdPrice = Number(found.last);
    }
  }catch(e){}
  return { wzPrice, cdPrice };
}

// ---------- Helpers: switch pair, redraw ----------
async function switchPair(pair){
  if(!PAIRS.includes(pair)) return;
  currentPair = pair;
  buildTabs();
  pairBadge.innerText = currentPair.toUpperCase();
  // load history, depth, and ws
  await fetchHistorical(currentPair, currentInterval);
  redrawMainFromCache();
  await fetchAndRenderDepth(currentPair);
  reconnectKline();
}

// redraw main when currency toggle changes
function toggleCurrency(){
  useINR = !useINR;
  toggleCurrencyBtn.innerText = useINR ? 'INR' : 'USD';
  refreshINR(); // ensure fresh rate
  redrawMainFromCache();
}

// fullscreen handler
fullscreenBtn.addEventListener('click', async ()=>{
  const el = document.getElementById('container');
  if(!document.fullscreenElement) await el.requestFullscreen().catch(()=>{});
  else await document.exitFullscreen().catch(()=>{});
});

// interval change
intervalEl.addEventListener('change', ()=> {
  currentInterval = intervalEl.value;
  (async ()=>{ await fetchHistorical(currentPair, currentInterval); redrawMainFromCache(); reconnectKline(); })();
});

// currency toggle
toggleCurrencyBtn.addEventListener('click', toggleCurrency);

// init UI interactions
themeSelect.value = theme;
chartTypeEl.value = chartType;
pointCapEl.value = MAX_POINTS;
preset1.style.outline = '2px solid rgba(255,255,255,0.08)'; // default

// ---------- Boot sequence ----------
(async ()=>{
  await refreshINR();
  // fetch history for initial pair
  await fetchHistorical(currentPair, currentInterval);
  redrawMainFromCache();
  await fetchAndRenderDepth(currentPair);
  reconnectKline();

  // periodic tasks
  setInterval(()=>fetchAndRenderDepth(currentPair), 30000);
  setInterval(()=>refreshINR(), 60000);
})();

// Ensure initial UI built
buildTabs();

</script>
</body>
</html>
