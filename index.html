<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Live INR Chart</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* BASIC STYLES */
  body{margin:0;font-family:Inter,system-ui;display:flex;flex-direction:column;align-items:center;background:#eef2ff;color:#07203a;}
  body.dark{background:#071026;color:#dbeafe;}
  .wrap{width:100%;max-width:1200px;padding:12px;}
  .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
  .tabs{display:flex;gap:6px;}
  .tab{padding:6px 10px;border-radius:6px;cursor:pointer;border:1px solid rgba(0,0,0,0.08);}
  .tab.active{background:#0ea5a3;color:#fff;border-color:transparent;}
  .btn{padding:6px 10px;border-radius:6px;cursor:pointer;background:#0ea5a3;color:#012;border:none;}
  .panel{background:rgba(255,255,255,0.9);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;}
  body.dark .panel{background:rgba(0,0,0,0.6);}
  #chart{width:100%;height:480px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="tabs" id="coinTabs">
        <div class="tab active" data-coin="BTC">BTC</div>
        <div class="tab" data-coin="ETH">ETH</div>
        <div class="tab" data-coin="SOL">SOL</div>
        <div class="tab" data-coin="XRP">XRP</div>
      </div>
      <div class="tabs" style="margin-top:4px;" id="tfTabs">
        <div class="tab active" data-tf="1m">1m</div>
        <div class="tab" data-tf="5m">5m</div>
        <div class="tab" data-tf="1h">1h</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button id="toggleTheme" class="btn">🌙</button>
      <button id="fullscreenBtn" class="btn">⤢</button>
    </div>
  </div>
  <div class="panel">
    <div id="chart"></div>
  </div>
</div>

<script>
/* CONFIG */
const symbolMap={BTC:'btcinr',ETH:'ethinr',SOL:'solinr',XRP:'xrpinr'};
let currentCoin='BTC',currentTF='1m',chart,candleSeries,volumeSeries,ma50Series,ma200Series,lastCandles=[],ws=null;

/* CREATE CHART */
function createChart(isDark=false){
  if(chart) chart.remove();
  chart=LightweightCharts.createChart(document.getElementById('chart'),{
    width:document.getElementById('chart').clientWidth,
    height:480,
    layout:{backgroundColor:isDark?'#071026':'transparent',textColor:isDark?'#dbeafe':'#07203a'},
    grid:{vertLines:{color:isDark?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.06)'},
          horzLines:{color:isDark?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.06)'}},
    rightPriceScale:{visible:true,borderColor:isDark?'rgba(255,255,255,0.06)':'#ccc'},
    timeScale:{borderColor:isDark?'rgba(255,255,255,0.06)':'#ccc'}
  });
  candleSeries=chart.addCandlestickSeries({upColor:'#16a34a',downColor:'#ef4444',wickUpColor:'#16a34a',wickDownColor:'#ef4444'});
  volumeSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'volume',scaleMargins:{top:0.8,bottom:0}});
  ma50Series=chart.addLineSeries({color:'#60a5fa',lineWidth:2});
  ma200Series=chart.addLineSeries({color:'#f59e0b',lineWidth:2});
}

/* UTIL */
function calcMA(data,period){
  let out=[],sum=0;
  for(let i=0;i<data.length;i++){
    sum+=data[i].close;
    if(i>=period) sum-=data[i-period].close;
    if(i>=period-1) out.push({time:data[i].time,value:sum/period});
  }
  return out;
}

/* FETCH HISTORICAL (via CORS proxy for GitHub Pages) */
async function fetchKlines(coin,tf,limit=500){
  const sym=symbolMap[coin];
  const url=`https://corsproxy.io/?https://api.wazirx.com/api/v2/kline?symbol=${sym}&interval=${tf}&limit=${limit}`;
  const res=await fetch(url); const data=await res.json();
  return data.map(c=>({time:Math.floor(c[0]/1000),open:+c[1],high:+c[2],low:+c[3],close:+c[4],volume:+c[5]}));
}

/* RENDER FULL */
async function renderFull(){
  lastCandles=await fetchKlines(currentCoin,currentTF,500);
  candleSeries.setData(lastCandles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
  volumeSeries.setData(lastCandles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(16,185,129,0.6)':'rgba(239,68,68,0.6)'})));
  ma50Series.setData(calcMA(lastCandles,50));
  ma200Series.setData(calcMA(lastCandles,200));
}

/* WEBSOCKET */
function startWS(){
  if(ws){ ws.close(); ws=null; }
  ws=new WebSocket('wss://stream.wazirx.com/ws');
  ws.onopen=()=>{ ws.send(JSON.stringify({method:"SUBSCRIBE",params:[`${symbolMap[currentCoin]}@kline_${currentTF}`],id:1})); };
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.k){
      const k=d.k;
      const candle={time:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};
      const idx=lastCandles.findIndex(c=>c.time===candle.time);
      if(idx>=0) lastCandles[idx]=candle;
      else lastCandles.push(candle);
      candleSeries.update(candle);
      volumeSeries.update({time:candle.time,value:candle.volume,color:candle.close>=candle.open?'rgba(16,185,129,0.6)':'rgba(239,68,68,0.6)'});
      ma50Series.setData(calcMA(lastCandles,50));
      ma200Series.setData(calcMA(lastCandles,200));
    }
  };
  ws.onclose=()=>setTimeout(startWS,3000);
  ws.onerror=()=>{ ws.close(); };
}

/* UI EVENTS */
document.addEventListener('DOMContentLoaded',async ()=>{
  createChart(false); await renderFull(); startWS();

  document.querySelectorAll('#coinTabs .tab').forEach(btn=>btn.addEventListener('click',async e=>{
    currentCoin=e.currentTarget.dataset.coin;
    document.querySelectorAll('#coinTabs .tab').forEach(t=>t.classList.toggle('active',t===btn));
    await renderFull(); startWS();
  }));
  document.querySelectorAll('#tfTabs .tab').forEach(btn=>btn.addEventListener('click',async e=>{
    currentTF=e.currentTarget.dataset.tf;
    document.querySelectorAll('#tfTabs .tab').forEach(t=>t.classList.toggle('active',t===btn));
    await renderFull(); startWS();
  }));

  document.getElementById('toggleTheme').addEventListener('click',()=>{
    const isDark=document.body.classList.toggle('dark');
    createChart(isDark); renderFull();
  });
  document.getElementById('fullscreenBtn').addEventListener('click',async ()=>{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  });
});
</script>
</body>
</html>
